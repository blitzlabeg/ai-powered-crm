[project]
name = "ai-powered-crm"
version = "1.0.0"
description = "An AI-powered CRM built with FastAPI, SQLAlchemy, and the OpenAI Responses API."
requires-python = ">=3.11"
readme = "README.md"

[tool.black]
line-length = 92
target-version = ["py311"]

[tool.ruff]
line-length = 92
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
